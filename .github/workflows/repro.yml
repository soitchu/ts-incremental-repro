name: repro

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so this starts failing when a release fixes the behaviour.
    - cron: '0 9 * * 1'

jobs:
  pinned:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: typescript@5.9.3
            install: typescript@5.9.3
            bin: tsc
          - label: typescript@7.0.2
            install: typescript@7.0.2
            bin: tsc
          - label: native-preview@7.0.0-dev.20260209.1
            install: '@typescript/native-preview@7.0.0-dev.20260209.1'
            bin: tsgo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save ${{ matrix.install }}

      - name: Reproduce
        run: |
          set +e
          node repro.mjs "node_modules/.bin/${{ matrix.bin }}" | tee out.txt
          rc=${PIPESTATUS[0]}
          set -e

          {
            echo "### ${{ matrix.label }}"
            echo '```'
            cat out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -eq 0 ]; then
            echo "::error::${{ matrix.label }} no longer replays the stale diagnostic. The behaviour changed, update the README."
            exit 1
          fi
          echo "Reproduced: ${{ matrix.label }} replayed a stale TS2305."

  floating:
    name: ${{ matrix.label }} (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: typescript@next
            install: typescript@next
            bin: tsc
          - label: native-preview@latest
            install: '@typescript/native-preview@latest'
            bin: tsgo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save ${{ matrix.install }}

      - name: Reproduce against a floating tag
        run: |
          set +e
          node repro.mjs "node_modules/.bin/${{ matrix.bin }}" | tee out.txt
          rc=${PIPESTATUS[0]}
          set -e

          {
            echo "### ${{ matrix.label }}"
            echo '```'
            cat out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$rc" -eq 0 ] && echo "Fixed upstream." || echo "Still reproduces."
